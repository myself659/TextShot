name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release version tag (e.g. v0.1.0)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve release tag
        id: resolve_tag
        env:
          INPUT_TAG: ${{ github.event.inputs.tag_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          TAG="${INPUT_TAG:-$REF_NAME}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Target release tag: $TAG"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.resolve_tag.outputs.tag }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          NOTES_FILE="releases/$RELEASE_TAG/RELEASE_NOTES.md"
          
          if [ ! -f "$NOTES_FILE" ]; then
            NOTES_FILE="CHANGELOG.md"
          fi
          
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG exists, updating notes..."
            gh release edit "$RELEASE_TAG" --title "TextShot $RELEASE_TAG" --notes-file "$NOTES_FILE"
          else
            echo "Creating release $RELEASE_TAG..."
            gh release create "$RELEASE_TAG" \
              --title "TextShot $RELEASE_TAG" \
              --notes-file "$NOTES_FILE"
          fi
          
          # Upload all release artifacts (zip archives and checksums)
          if [ -d "releases/$RELEASE_TAG" ]; then
            echo "Uploading assets from releases/$RELEASE_TAG..."
            shopt -s nullglob
            ASSETS=(releases/"$RELEASE_TAG"/*.zip releases/"$RELEASE_TAG"/SHA256SUMS.txt)
            if [ ${#ASSETS[@]} -gt 0 ]; then
              gh release upload "$RELEASE_TAG" "${ASSETS[@]}" --clobber
            fi
          fi
